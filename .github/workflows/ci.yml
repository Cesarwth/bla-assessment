name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests + coverage gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # `build` = compile + all tests + JaCoCo verification (fails below 90 % lines / 80 % branches).
      - run: ./gradlew build

  frontend:
    name: Frontend (types, lint, tests + coverage gate, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Fails below 90 % lines / 85 % branches and on any console warning during a test.
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --omit=dev

  stack:
    name: Whole stack (docker compose + smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      # Creates .env with random secrets, builds and starts everything, waits until it answers.
      - run: ./scripts/start.sh
      - run: ./scripts/smoke.sh
      - name: Logs (only when something failed)
        if: failure()
        run: docker compose logs --no-color --tail=200
