spring:
  application:
    name: bla-assessment
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pokemon}
    username: ${DB_USER:pokemon}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # Loads the lazy element collections of a whole page in a few queries instead of 4 per row.
        default_batch_fetch_size: 50
    hibernate:
      ddl-auto: validate

  mail:
    # Local dev sink is Mailpit (plain SMTP, no auth/TLS). Real SMTP: set MAIL_USERNAME/MAIL_PASSWORD, MAIL_AUTH=true, MAIL_STARTTLS=true.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      # An unreachable mail server must slow a request down by seconds, never hang it.
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

management:
  health:
    mail:
      # A missing mail server must never make the container unhealthy: mail is not needed to serve the API.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health

app:
  # Origin of the web app, used to build the link in the password reset e-mail.
  public-url: ${APP_PUBLIC_URL:http://localhost:8081}
  mail:
    from: ${MAIL_FROM:no-reply@pokedex.local}
  password-reset:
    ttl: ${PASSWORD_RESET_TTL_MINUTES:30}m
  sync:
    # Time budget of one bulk sync; keep it below the reverse proxy's read timeout (nginx: 120 s).
    max-duration: ${SYNC_MAX_DURATION_SECONDS:90}s
  pokeapi:
    base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
    connect-timeout: 2s
    read-timeout: 5s
    cache-ttl: 1h
    cache-max-size: 2000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # No default on purpose: the secret must come from the environment.
    secret: ${JWT_SECRET:}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  seed:
    # Opt-in: a real deployment starts empty. Needs the demo accounts above (it assigns the Pokemon to them).
    demo-data:
      enabled: ${SEED_DEMO_DATA:false}
    # Demo-only account for the interview; documented in the README. Disable in real deployments.
    demo-user:
      enabled: ${SEED_DEMO_USER:false}
      username: demo
      email: demo@pokemon.dev
      # No default: the demo user only exists when a password is provided.
      password: ${DEMO_USER_PASSWORD:}
      admin-username: demo-admin
      admin-email: admin@pokemon.dev
      # No default: the admin account only exists when this variable is set.
      admin-password: ${DEMO_ADMIN_PASSWORD:}
