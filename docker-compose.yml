services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No published port: only the app container can reach the database.

  # A local mailbox for the demo: the password-reset e-mails land here (http://localhost:8025) instead of going out to
  # the internet. In-memory, no auth: strictly a development tool, bound to this machine only. A real deployment
  # points MAIL_HOST at a real SMTP server and drops this service.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:8025:8025"

  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
      SEED_DEMO_USER: ${SEED_DEMO_USER:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Optional: only needed when the demo accounts are seeded (a real deployment leaves them empty).
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Optional tuning; the defaults are the same as the API's own.
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      POKEAPI_BASE_URL: ${POKEAPI_BASE_URL:-https://pokeapi.co/api/v2}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      # Password reset e-mails: where to send them and which address the links in them point to.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@pokedex.local}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8081}
      # Only for a real SMTP server (the bundled Mailpit needs none of these).
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
    # Bound to this machine only: the browser goes through nginx (below), and a plain-HTTP API must not be reachable
    # from the network. Publish it more widely only behind a TLS-terminating proxy.
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      app:
        condition: service_healthy
    # The only door for the browser: nginx serves the app and proxies /api to the backend (no CORS needed).
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  pgdata:
