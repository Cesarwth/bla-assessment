services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No published port: only the app container can reach the database.

  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
      SEED_DEMO_USER: ${SEED_DEMO_USER:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Optional: only needed when the demo accounts are seeded (a real deployment leaves them empty).
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    # Bound to this machine only: the browser goes through nginx (below), and a plain-HTTP API must not be reachable
    # from the network. Publish it more widely only behind a TLS-terminating proxy.
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      app:
        condition: service_healthy
    # The only door for the browser: nginx serves the app and proxies /api to the backend (no CORS needed).
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  pgdata:
