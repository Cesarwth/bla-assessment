<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 604" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Clean Architecture of the Pokédex backend</title>
  <desc id="d">The browser talks to nginx, which proxies to the Spring Boot API. Inside the API, infrastructure adapters depend on the application layer (use cases and ports), which depends on the pure Java domain. Adapters implement the output ports and talk to PostgreSQL, PokeAPI and the mail server.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .t { font-size: 13px; fill: #0f172a; }
      .b { font-weight: 700; }
      .s { font-size: 11.5px; fill: #334155; }
      .h { font-size: 13px; font-weight: 700; fill: #1e293b; letter-spacing: .02em; }
      .ext { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .ad { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.5; }
      .ap { fill: #dcfce7; stroke: #15803d; stroke-width: 1.5; }
      .dm { fill: #fef9c3; stroke: #a16207; stroke-width: 1.5; }
      .fr { fill: none; stroke-width: 2; }
      .ln { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .im { stroke: #7c3aed; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow-dash); }
    </style>
  </defs>

  <rect width="1000" height="604" fill="#ffffff"/>

  <!-- external systems -->
  <rect class="ext" x="40" y="14" width="160" height="52" rx="10"/>
  <text class="t b" x="120" y="36" text-anchor="middle">Browser</text>
  <text class="s" x="120" y="54" text-anchor="middle">React + Tailwind</text>
  <rect class="ext" x="226" y="14" width="210" height="52" rx="10"/>
  <text class="t b" x="331" y="36" text-anchor="middle">nginx</text>
  <text class="s" x="331" y="54" text-anchor="middle">static app + /api proxy</text>
  <rect class="ext" x="610" y="14" width="120" height="52" rx="10"/>
  <text class="t b" x="670" y="36" text-anchor="middle">PostgreSQL</text>
  <text class="s" x="670" y="54" text-anchor="middle">relational store</text>
  <rect class="ext" x="742" y="14" width="120" height="52" rx="10"/>
  <text class="t b" x="802" y="36" text-anchor="middle">PokeAPI</text>
  <text class="s" x="802" y="54" text-anchor="middle">public catalog</text>
  <rect class="ext" x="874" y="14" width="92" height="52" rx="10"/>
  <text class="t b" x="920" y="36" text-anchor="middle">Mailpit</text>
  <text class="s" x="920" y="54" text-anchor="middle">test inbox</text>
  <path class="ln" d="M200 40 H224"/>

  <!-- infrastructure frame -->
  <rect class="fr" x="24" y="104" width="952" height="462" rx="16" stroke="#0369a1"/>
  <text class="h" x="40" y="126" fill="#0369a1">INFRASTRUCTURE — adapters and frameworks</text>

  <!-- adapters -->
  <rect class="ad" x="44" y="140" width="170" height="68" rx="8"/>
  <text class="t b" x="129" y="162" text-anchor="middle">security</text>
  <text class="s" x="129" y="180" text-anchor="middle">JWT, BCrypt,</text>
  <text class="s" x="129" y="195" text-anchor="middle">route rules</text>
  <rect class="ad" x="226" y="140" width="210" height="68" rx="8"/>
  <text class="t b" x="331" y="162" text-anchor="middle">web</text>
  <text class="s" x="331" y="180" text-anchor="middle">controllers, DTOs,</text>
  <text class="s" x="331" y="195" text-anchor="middle">one error handler</text>
  <rect class="ad" x="448" y="140" width="150" height="68" rx="8"/>
  <text class="t b" x="523" y="162" text-anchor="middle">config</text>
  <text class="s" x="523" y="180" text-anchor="middle">wires use cases,</text>
  <text class="s" x="523" y="195" text-anchor="middle">demo seeders</text>
  <rect class="ad" x="610" y="140" width="120" height="68" rx="8"/>
  <text class="t b" x="670" y="162" text-anchor="middle">persistence</text>
  <text class="s" x="670" y="180" text-anchor="middle">JPA, Flyway</text>
  <rect class="ad" x="742" y="140" width="120" height="68" rx="8"/>
  <text class="t b" x="802" y="162" text-anchor="middle">pokeapi</text>
  <text class="s" x="802" y="180" text-anchor="middle">HTTP client,</text>
  <text class="s" x="802" y="195" text-anchor="middle">Caffeine cache</text>
  <rect class="ad" x="874" y="140" width="92" height="68" rx="8"/>
  <text class="t b" x="920" y="162" text-anchor="middle">mail</text>
  <text class="s" x="920" y="180" text-anchor="middle">SMTP</text>

  <!-- external links -->
  <path class="ln" d="M400 66 V138"/>
  <path class="ln" d="M670 138 V68" />
  <path class="ln" d="M802 138 V68" />
  <path class="ln" d="M920 138 V68" />

  <!-- application frame -->
  <rect class="fr" x="90" y="244" width="820" height="174" rx="14" stroke="#15803d"/>
  <text class="h" x="106" y="410" fill="#15803d">APPLICATION — use cases and ports</text>
  <rect class="ap" x="112" y="282" width="196" height="108" rx="8"/>
  <text class="t b" x="210" y="304" text-anchor="middle">ports in</text>
  <text class="s" x="210" y="324" text-anchor="middle">one interface per use case</text>
  <text class="s" x="210" y="341" text-anchor="middle">SyncSelectedPokemonUseCase,</text>
  <text class="s" x="210" y="357" text-anchor="middle">UpdateStoredPokemonUseCase…</text>
  <rect class="ap" x="352" y="282" width="196" height="108" rx="8"/>
  <text class="t b" x="450" y="304" text-anchor="middle">use cases</text>
  <text class="s" x="450" y="324" text-anchor="middle">one class per behaviour:</text>
  <text class="s" x="450" y="341" text-anchor="middle">SyncPokemon, ResetPassword,</text>
  <text class="s" x="450" y="357" text-anchor="middle">ListPokemon… (16)</text>
  <rect class="ap" x="592" y="282" width="296" height="108" rx="8"/>
  <text class="t b" x="740" y="304" text-anchor="middle">ports out</text>
  <text class="s" x="740" y="324" text-anchor="middle">what the use cases need, as interfaces:</text>
  <text class="s" x="740" y="341" text-anchor="middle">PokeApiGateway, PokemonRepository,</text>
  <text class="s" x="740" y="357" text-anchor="middle">UserRepository, PasswordHasher, TokenIssuer,</text>
  <text class="s" x="740" y="373" text-anchor="middle">PasswordResetNotifier…</text>
  <path class="im" d="M352 336 H310"/>
  <path class="ln" d="M548 336 H590"/>

  <!-- domain frame -->
  <rect class="fr" x="270" y="440" width="460" height="104" rx="14" stroke="#a16207"/>
  <text class="h" x="286" y="462" fill="#a16207">DOMAIN — pure Java</text>
  <rect class="dm" x="290" y="474" width="420" height="56" rx="8"/>
  <text class="t b" x="500" y="494" text-anchor="middle">StoredPokemon · LocalAttributes · User · Actor</text>
  <text class="s" x="500" y="512" text-anchor="middle">PokemonIdentifier · PokemonSearchQuery · exceptions · rules</text>
  <path class="ln" d="M450 392 V438"/>
  <text class="s" x="462" y="428">uses</text>

  <!-- adapters -> application -->
  <path class="ln" d="M331 208 V242 H210 V280"/>
  <text class="s" x="222" y="236">calls</text>
  <path class="ln" d="M523 208 V232 H450 V280" stroke-dasharray="2 3"/>
  <text class="s" x="534" y="226">creates</text>
  <!-- implements ports out -->
  <path class="im" d="M670 208 V230 H690 V280"/>
  <path class="im" d="M802 208 V280"/>
  <path class="im" d="M920 208 V250 H850 V280"/>
  <text class="s" x="808" y="236" fill="#7c3aed" style="fill:#7c3aed">implement</text>

  <!-- legend -->
  <path class="ln" d="M50 586 H90"/>
  <text class="s" x="98" y="590">depends on / calls</text>
  <path class="im" d="M250 586 H290"/>
  <text class="s" x="298" y="590">implements a port</text>
  <text class="s" x="440" y="590">Dependencies point inward only — checked by ArchUnit on every build.</text>
</svg>
