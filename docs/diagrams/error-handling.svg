<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 852" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Error handling, from exception to screen</title>
  <desc id="d">A domain exception (19 types) raised in a use case is mapped by the single GlobalExceptionHandler, or by ApiSecurityErrorHandler for 401 and 403, to one JSON body with timestamp, status, code, message and fieldErrors. The frontend API client turns every failure, including non-JSON answers, into an ApiError. The UI shows field errors next to the field with focus, a retry button, an ErrorBoundary, and ends the session on 401. Unexpected failures return a fixed 500 message and the detail only goes to the log. A table lists example codes per status.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <style>
      .t { font-size: 16px; fill: #0f172a; }
      .b { font-weight: 700; }
      .e { font-size: 14px; fill: #0f172a; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s { font-size: 14px; fill: #334155; }
      .h { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
      .ext { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .ad { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.5; }
      .ap { fill: #dcfce7; stroke: #15803d; stroke-width: 1.5; }
      .dm { fill: #fef9c3; stroke: #a16207; stroke-width: 1.5; }
      .fr { fill: none; stroke-width: 2; }
      .ln { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="852" fill="#ffffff"/>
  <text x="24" y="30" style="font-size:22px;font-weight:700;fill:#0f172a">Error handling, from exception to screen</text>
  <text class="s" x="24" y="52">One error shape for everything: the backend always answers with the same JSON body</text>
  <text class="h" x="24" y="80" style="fill:#0369a1">Backend</text>
  <text class="h" x="760" y="80" style="fill:#0f172a">Frontend</text>
  <path d="M745 66 V290" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

  <rect class="dm" x="24" y="92" width="200" height="70" rx="8"/>
  <text class="t b" x="38" y="116">Domain exception</text>
  <text class="s" x="38" y="138">19 types, raised in</text>
  <text class="s" x="38" y="157">use cases and domain</text>
  <rect class="ext" x="24" y="176" width="200" height="96" rx="8"/>
  <text class="t b" x="38" y="200">Unexpected failure</text>
  <text class="s" x="38" y="222">bug, database down...</text>
  <text class="s" x="38" y="241">fixed 500 message</text>
  <text class="s" x="38" y="260">detail only in the log</text>
  <rect class="ad" x="262" y="92" width="250" height="180" rx="8"/>
  <text class="t b" x="276" y="116">GlobalExceptionHandler</text>
  <text class="s" x="276" y="138">the single @RestControllerAdvice</text>
  <text class="s" x="276" y="157">one handler per exception type</text>
  <text class="s" x="276" y="176">also validation, bad JSON,</text>
  <text class="s" x="276" y="195">database constraint (409)</text>
  <rect class="ad" x="262" y="300" width="250" height="74" rx="8"/>
  <text class="t b" x="276" y="324">ApiSecurityErrorHandler</text>
  <text class="s" x="276" y="346">401 / 403 from the filter chain</text>
  <rect class="ext" x="540" y="92" width="190" height="180" rx="8"/>
  <text class="t b" x="554" y="116">JSON error body</text>
  <text class="e" x="554" y="138">timestamp</text>
  <text class="e" x="554" y="157">status</text>
  <text class="e" x="554" y="176">code</text>
  <text class="e" x="554" y="195">message</text>
  <text class="e" x="554" y="214">fieldErrors[]</text>
  <rect class="ad" x="760" y="92" width="216" height="180" rx="8"/>
  <text class="t b" x="774" y="116">Single API client</text>
  <text class="s" x="774" y="138">shared/api/client.ts</text>
  <text class="s" x="774" y="157">builds one ApiError</text>
  <text class="s" x="774" y="176">status, code, message,</text>
  <text class="s" x="774" y="195">fieldErrors</text>
  <text class="s" x="774" y="214">non-JSON: HTTP_&lt;n&gt;</text>
  <text class="s" x="774" y="233">offline: NETWORK_ERROR</text>
  <path class="ln" d="M224 127 H260"/>
  <path class="ln" d="M224 224 H260"/>
  <path class="ln" d="M512 182 H538"/>
  <path class="ln" d="M512 337 H635 V274"/>
  <path class="ln" d="M730 182 H758"/>

  <path class="ln" d="M868 272 V392"/>
  <text class="s" x="882" y="320">every failure,</text>
  <text class="s" x="882" y="340">as an ApiError</text>

  <rect class="fr" x="24" y="394" width="952" height="152" rx="14" stroke="#15803d"/>
  <text class="h" x="40" y="418" style="fill:#15803d">What the user sees</text>
  <rect class="ap" x="36" y="436" width="220" height="98" rx="8"/>
  <text class="t b" x="50" y="460">Field errors</text>
  <text class="s" x="50" y="482">shown next to the field,</text>
  <text class="s" x="50" y="501">focus goes to the</text>
  <text class="s" x="50" y="520">first invalid one</text>
  <rect class="ap" x="272" y="436" width="220" height="98" rx="8"/>
  <text class="t b" x="286" y="460">Try again button</text>
  <text class="s" x="286" y="482">ErrorState shows the</text>
  <text class="s" x="286" y="501">message and a button</text>
  <text class="s" x="286" y="520">to repeat the request</text>
  <rect class="ap" x="508" y="436" width="220" height="98" rx="8"/>
  <text class="t b" x="522" y="460">ErrorBoundary</text>
  <text class="s" x="522" y="482">an unexpected crash while</text>
  <text class="s" x="522" y="501">rendering shows a page</text>
  <text class="s" x="522" y="520">with Try again</text>
  <rect class="ap" x="744" y="436" width="220" height="98" rx="8"/>
  <text class="t b" x="758" y="460">401 ends the session</text>
  <text class="s" x="758" y="482">token cleared, query cache</text>
  <text class="s" x="758" y="501">reset, "session expired"</text>
  <text class="s" x="758" y="520">(only if a token was sent)</text>

  <text class="h" x="24" y="574" style="fill:#475569">One error shape: status and example codes</text>
  <rect x="24" y="580" width="952" height="246" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="s" x="40" y="604" style="font-weight:700;fill:#0f172a">Status</text>
  <text class="s" x="150" y="604" style="font-weight:700;fill:#0f172a">Example codes</text>
  <text class="e" x="40" y="634" style="font-size:15px;font-weight:700">400</text>
  <text class="e" x="150" y="634" style="font-size:13px">VALIDATION_FAILED (+ fieldErrors), MALFORMED_REQUEST, INVALID_PAGINATION, WEAK_PASSWORD, ...</text>
  <text class="e" x="40" y="664" style="font-size:15px;font-weight:700">401</text>
  <text class="e" x="150" y="664" style="font-size:13px">UNAUTHORIZED (no, invalid or expired token), INVALID_CREDENTIALS</text>
  <text class="e" x="40" y="694" style="font-size:15px;font-weight:700">403</text>
  <text class="e" x="150" y="694" style="font-size:13px">FORBIDDEN (access denied by the route rules)</text>
  <text class="e" x="40" y="724" style="font-size:15px;font-weight:700">404</text>
  <text class="e" x="150" y="724" style="font-size:13px">POKEMON_NOT_FOUND, STORED_POKEMON_NOT_FOUND</text>
  <text class="e" x="40" y="754" style="font-size:15px;font-weight:700">409</text>
  <text class="e" x="150" y="754" style="font-size:13px">USERNAME_TAKEN, EMAIL_TAKEN, CONCURRENT_MODIFICATION, CONFLICT</text>
  <text class="e" x="40" y="784" style="font-size:15px;font-weight:700">502 / 504</text>
  <text class="e" x="150" y="784" style="font-size:13px">CATALOG_UNAVAILABLE / CATALOG_TIMEOUT (PokeAPI down or slow)</text>
  <text class="e" x="40" y="814" style="font-size:15px;font-weight:700">500</text>
  <text class="e" x="150" y="814" style="font-size:13px">INTERNAL_ERROR (fixed message, details only in the server log)</text>
</svg>
