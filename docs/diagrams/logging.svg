<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Logging: the life of one request</title>
  <desc id="d">The browser calls nginx, which proxies to the backend. RequestLogFilter accepts a valid X-Request-Id or generates one, puts it in the MDC and echoes it in the response header. The controller logs a business event at INFO with ids only. When the request ends the filter writes one access line with method, path, status and duration. Everything goes to the console, read with docker compose logs or a collector; JSON output is optional with LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs and levels are set with LOG_LEVEL and APP_LOG_LEVEL. Passwords, tokens, reset links, e-mails, usernames, query strings and bodies are never logged, enforced by tests.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <style>
      .t { font-size: 16px; fill: #0f172a; }
      .b { font-weight: 700; }
      .e { font-size: 14px; fill: #0f172a; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s { font-size: 14px; fill: #334155; }
      .h { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
      .ext { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .ad { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.5; }
      .no { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
      .ln { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="680" fill="#ffffff"/>
  <text x="24" y="30" style="font-size:22px;font-weight:700;fill:#0f172a">Logging: the life of one request</text>
  <text class="s" x="24" y="52">One id ties every log line of a request together and comes back to the caller</text>
  <text class="h" x="24" y="80" style="fill:#0369a1">Request</text>

  <rect class="ext" x="24" y="92" width="120" height="150" rx="8"/>
  <text class="t b" x="38" y="116">Browser</text>
  <text class="s" x="38" y="138">may send an</text>
  <text class="s" x="38" y="157">X-Request-Id</text>
  <text class="s" x="38" y="176">header</text>
  <rect class="ext" x="170" y="92" width="120" height="150" rx="8"/>
  <text class="t b" x="184" y="116">nginx</text>
  <text class="s" x="184" y="138">proxies /api</text>
  <text class="s" x="184" y="157">to the backend</text>
  <rect class="ad" x="316" y="92" width="330" height="150" rx="8"/>
  <text class="t b" x="330" y="116">RequestLogFilter</text>
  <text class="s" x="330" y="136" style="font-style:italic">runs first, before Spring Security</text>
  <text class="s" x="330" y="158">1  keeps a valid X-Request-Id</text>
  <text class="s" x="330" y="177">    (letters, digits . _ -, max 64)</text>
  <text class="s" x="330" y="196">    otherwise generates a UUID</text>
  <text class="s" x="330" y="215">2  puts it in the MDC</text>
  <text class="s" x="330" y="234">3  echoes it in the response header</text>
  <rect class="ad" x="672" y="92" width="304" height="150" rx="8"/>
  <text class="t b" x="686" y="116">Controller</text>
  <text class="s" x="686" y="136" style="font-style:italic">a business event, ids only</text>
  <text class="e" x="686" y="158" style="font-size:13px">INFO  User 7 registered</text>
  <text class="e" x="686" y="177" style="font-size:13px">INFO  Trainer 7 added Pokemon 25</text>
  <text class="e" x="686" y="196" style="font-size:13px">INFO  Trainer 7 removed Pokemon 25</text>
  <rect class="ad" x="316" y="284" width="660" height="98" rx="8"/>
  <text class="t b" x="330" y="308">Access line</text>
  <text class="s" x="330" y="328" style="font-style:italic">written when the request ends</text>
  <text class="e" x="330" y="350" style="font-size:15px;font-weight:700">INFO [requestId] ... GET /api/v1/pokemon 200 14ms</text>
  <text class="s" x="330" y="372">method, path, status, duration only · 5xx at WARN · /actuator/health at DEBUG</text>
  <rect class="ext" x="24" y="284" width="250" height="98" rx="8"/>
  <text class="t b" x="38" y="308">Console (stdout)</text>
  <text class="s" x="38" y="330">every line carries</text>
  <text class="s" x="38" y="349">[requestId]</text>
  <rect class="ext" x="24" y="424" width="300" height="110" rx="8"/>
  <text class="t b" x="38" y="448">Reading the logs</text>
  <text class="s" x="38" y="470">docker compose logs app</text>
  <text class="s" x="38" y="489">or any log collector</text>
  <rect class="ext" x="352" y="424" width="300" height="110" rx="8"/>
  <text class="t b" x="366" y="448">JSON instead of text</text>
  <text class="e" x="366" y="470" style="font-size:13px">LOGGING_STRUCTURED_</text>
  <text class="e" x="366" y="489" style="font-size:13px">FORMAT_CONSOLE=ecs</text>
  <text class="e" x="366" y="508" style="font-size:13px">requestId becomes a field</text>
  <rect class="ext" x="680" y="424" width="296" height="110" rx="8"/>
  <text class="t b" x="694" y="448">Levels</text>
  <text class="s" x="694" y="470">LOG_LEVEL: root</text>
  <text class="s" x="694" y="489">APP_LOG_LEVEL: our package</text>
  <text class="s" x="694" y="508">both default to INFO</text>
  <path class="ln" d="M144 167 H168"/>
  <path class="ln" d="M290 167 H314"/>
  <path class="ln" d="M646 167 H670"/>
  <path class="ln" d="M481 242 V282"/>
  <text class="s" x="495" y="268">after the response</text>
  <path class="ln" d="M314 333 H276"/>
  <path class="ln" d="M149 384 V422"/>


  <rect class="no" x="24" y="566" width="952" height="92" rx="10"/>
  <text class="t b" x="40" y="594" style="fill:#991b1b">Never logged</text>
  <text class="s" x="40" y="618" style="fill:#0f172a;font-size:15px">passwords · tokens · reset links · e-mails · usernames · query strings · request and response bodies</text>
  <text class="s" x="40" y="642">Enforced by tests: RequestLogFilterTest and LoggingHygieneIT capture every logger during the account flows.</text>
</svg>
