<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Test strategy and quality gates</title>
  <desc id="d">Test levels as a pyramid with real counts: 167 unit, 49 persistence, 109 adapter and configuration, 190 web slice, 44 full-context integration and 7 ArchUnit rules in the backend (566), 350 frontend tests with React Testing Library and MSW, a 40-check smoke test of the running stack and a manual pass in Chrome; plus the quality gates for coverage, style and dependencies.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <style>
      .t { font-size: 16px; fill: #0f172a; }
      .b { font-weight: 700; }
      .s { font-size: 13.5px; fill: #334155; }
      .h { font-size: 16px; font-weight: 700; fill: #1e293b; letter-spacing: .02em; }
      .n { font-size: 24px; font-weight: 800; fill: #0f172a; }
      .ext { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .ad { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.5; }
      .ap { fill: #dcfce7; stroke: #15803d; stroke-width: 1.5; }
      .dm { fill: #fef9c3; stroke: #a16207; stroke-width: 1.5; }
      .nx { fill: #faf5ff; stroke: #7c3aed; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .fr { fill: none; stroke-width: 2; }
      .ln { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .im { stroke: #7c3aed; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow-dash); }
      .pu { fill: #7c3aed; }
    </style>
  </defs>
  <rect width="1000" height="660" fill="#ffffff"/>
  <text class="h" x="30" y="32">TEST LEVELS — 566 backend + 350 frontend tests, plus whole-stack checks</text>
  <rect class="ext" x="160" y="56" width="300" height="56" rx="8"/>
  <text class="t b" x="310" y="80" text-anchor="middle">Manual pass in real Chrome</text>
  <text class="s" x="310" y="99" text-anchor="middle">desktop, mobile, dark mode; no console errors</text>
  <rect class="ext" x="140" y="120" width="340" height="56" rx="8"/>
  <text class="n" x="154" y="156">40</text>
  <text class="t b" x="200" y="144">Smoke test of the running stack</text>
  <text class="s" x="200" y="163">scripts/smoke.sh, through nginx</text>
  <rect class="ad" x="120" y="184" width="380" height="56" rx="8"/>
  <text class="n" x="134" y="220">44</text>
  <text class="t b" x="180" y="208">Integration (full Spring context)</text>
  <text class="s" x="180" y="227">register → sync → edit → delete, recovery…</text>
  <rect class="ad" x="100" y="248" width="420" height="56" rx="8"/>
  <text class="n" x="114" y="284">190</text>
  <text class="t b" x="172" y="272">Web slice (@WebMvcTest)</text>
  <text class="s" x="172" y="291">security matrix, error handler, log filter</text>
  <rect class="ad" x="80" y="312" width="460" height="56" rx="8"/>
  <text class="n" x="94" y="348">109</text>
  <text class="t b" x="152" y="336">Adapters and configuration</text>
  <text class="s" x="152" y="355">PokeAPI client vs stand-in server, JWT, cache, mail</text>
  <rect class="ad" x="60" y="376" width="500" height="56" rx="8"/>
  <text class="n" x="74" y="412">49</text>
  <text class="t b" x="120" y="400">Persistence (@DataJpaTest)</text>
  <text class="s" x="120" y="419">H2 + real Flyway migrations, incl. data upgrade</text>
  <rect class="ap" x="40" y="440" width="540" height="56" rx="8"/>
  <text class="n" x="54" y="476">167</text>
  <text class="t b" x="112" y="464">Unit: domain and use cases</text>
  <text class="s" x="112" y="483">pure Java, Mockito only on ports</text>
  <rect class="dm" x="40" y="504" width="540" height="56" rx="8"/>
  <text class="n" x="54" y="540">7</text>
  <text class="t b" x="100" y="528">ArchUnit rules</text>
  <text class="s" x="100" y="547">dependencies point inward only</text>
  <rect class="ad" x="620" y="56" width="350" height="120" rx="8"/>
  <text class="n" x="636" y="92">350</text>
  <text class="t b" x="694" y="90">Frontend (Vitest)</text>
  <text class="s" x="636" y="116">React Testing Library + MSW:</text>
  <text class="s" x="636" y="134">every page with its real data layer,</text>
  <text class="s" x="636" y="152">API mocked at network level</text>
  <text class="s" x="636" y="168">+ axe accessibility + palette contrast</text>
  <rect class="fr" x="610" y="196" width="370" height="364" rx="14" stroke="#15803d"/>
  <text class="h" x="626" y="220" fill="#15803d">QUALITY GATES</text>
  <text class="t b" x="626" y="248">Backend  (./gradlew build)</text>
  <text class="s" x="626" y="268">JaCoCo: 90% lines / 80% branches</text>
  <text class="s" x="626" y="286">actual ≈ 97% / 89%</text>
  <text class="s" x="626" y="306">Checkstyle: no one-letter names</text>
  <text class="t b" x="626" y="338">Frontend  (npm run …)</text>
  <text class="s" x="626" y="358">coverage: 90 lines/statements/functions,</text>
  <text class="s" x="626" y="376">85 branches; actual ≈ 99.6% / 95%</text>
  <text class="s" x="626" y="396">console.error/warn fails a test</text>
  <text class="s" x="626" y="416">ESLint zero warnings + id-length</text>
  <text class="s" x="626" y="434">ESLint rule: features never import each other</text>
  <text class="s" x="626" y="452">strict TypeScript (typecheck)</text>
  <text class="t b" x="626" y="484">Supply chain and dead code</text>
  <text class="s" x="626" y="504">npm audit — in CI</text>
  <text class="s" x="626" y="524">knip (unused code), Trivy (both images)</text>
  <text class="s" x="626" y="542">— run by hand, not in CI</text>
  <text class="s" x="40" y="602">Backend: 167 + 190 + 49 + 109 + 44 + 7 = 566.</text>
  <text class="s" x="40" y="622">Narrow top: few, slow, broad. Wide base: many, fast.</text>
  <text class="s" x="40" y="642">In CI the gates fail the build; the stack job then runs start.sh + smoke.sh.</text>
</svg>
