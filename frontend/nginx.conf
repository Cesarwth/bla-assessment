server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's embedded DNS; resolving at request time (variable below) means nginx starts even if the API is not up yet.
  resolver 127.0.0.11 valid=10s;

  # Same origin for the browser: the API is reached through here, so the app needs no CORS.
  location /api/ {
    set $backend http://app:8080;
    proxy_pass $backend;
    # $http_host keeps the port (localhost:8081). With $host the API would see "localhost", decide that the browser's
    # Origin (http://localhost:8081) is a different origin, and refuse every POST/PATCH/DELETE as a CORS violation.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    # No security headers here: the API already sends its own, and repeating them would duplicate each one.
  }

  # Hashed bundles never change: cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # Single-page app: any other path is a client-side route, so it gets index.html (which must never be cached).
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }
}
