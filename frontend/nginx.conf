# Behind a TLS-terminating proxy (the production setup) X-Forwarded-Proto says https; on its own it is plain http.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https   https;
}

# Sent only when the request really came over HTTPS; an empty value makes nginx omit the header.
map $forwarded_proto $hsts {
  default "";
  https   "max-age=63072000; includeSubDomains";
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's embedded DNS; resolving at request time (variable in proxy-api.conf) means nginx starts even if the API
  # is not up yet.
  resolver 127.0.0.11 valid=10s;

  # Adding a selection of Pokémon runs up to ~150 upstream calls in a row (50 ids, up to 3 calls each, 5 s limit per
  # call): give that one route time to finish instead of cutting it with an HTML 504 while rows are still being saved.
  location = /api/v1/collection/sync {
    proxy_read_timeout 120s;
    include /etc/nginx/proxy-api.conf;
  }

  # Same origin for the browser: the API is reached through here, so the app needs no CORS.
  location /api/ {
    proxy_read_timeout 15s;
    include /etc/nginx/proxy-api.conf;
  }

  # Hashed bundles never change: cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # The e-mailed reset link carries a one-time secret in the query string; keep that request out of the access log
  # (the page removes the token from the address bar as soon as it has read it).
  location = /reset-password {
    access_log off;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files /index.html =404;
  }

  # Single-page app: any other path is a client-side route, so it gets index.html (which must never be cached).
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }
}
